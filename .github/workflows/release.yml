name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${PACKAGE_VERSION} (${EXPECTED_TAG})." >&2
            exit 1
          fi

      - name: Type check
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Pack npm tarball
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          PACKAGE_FILE="$(find release -maxdepth 1 -name 'warden-cli-*.tgz' -print -quit)"
          if [ -z "${PACKAGE_FILE}" ]; then
            echo "npm pack did not create a package tarball." >&2
            exit 1
          fi
          cp "${PACKAGE_FILE}" release/warden-cli.tgz
          echo "PACKAGE_FILE=${PACKAGE_FILE}" >> "${GITHUB_ENV}"

      - name: Generate checksums and Homebrew formula
        run: |
          set -euo pipefail
          TARBALL_SHA="$(sha256sum release/warden-cli.tgz | awk '{print $1}')"
          WARDEN_CLI_TARBALL_SHA256="${TARBALL_SHA}" node scripts/generate-homebrew-formula.mjs
          cp scripts/install.sh release/install.sh
          chmod +x release/install.sh
          (cd release && sha256sum warden-cli*.tgz warden-cli.rb install.sh > checksums.txt)

      - name: Publish to npm when NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          if npm view "warden-cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::warden-cli@${PACKAGE_VERSION} already exists on npm; skipping npm publish."
            exit 0
          fi
          npm publish "./${PACKAGE_FILE}" --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/warden-cli-*.tgz
            release/warden-cli.tgz
            release/warden-cli.rb
            release/install.sh
            release/checksums.txt
